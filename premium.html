<!-- Page-to-page transitions. Inline, not in animations.css: Chromium decides
     whether the arriving page opts in before external stylesheets apply. -->
<style>@media (prefers-reduced-motion: no-preference) { @view-transition { navigation: auto; } }</style>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<script>
  /* Runs before the first paint: keeps the drifting background continuous
     between pages and applies the transparency preference without a flash.
     See docs/07-LIQUID-GLASS.md. */
  (function () {
    var d = document.documentElement;
    /* Arriving through a view transition: the title is already morphing. */
    addEventListener("pagereveal", function (e) { if (e.viewTransition) d.classList.add("vt-in"); });
    try {
      d.style.setProperty("--ambient-t", "-" + (Date.now() / 1000 % 600).toFixed(2) + "s");
      var p = localStorage.getItem("jnucse:transparency");
      if (p === "reduced" || (p !== "full" && matchMedia("(prefers-reduced-transparency: reduce)").matches)) {
        d.dataset.transparency = "reduced";
      }
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..800;1,62..125,400..700&display=swap">
