<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engine tests — JnUCSE eFootball</title>
<style>
  :root { --ink:#12171f; --muted:#5b6775; --line:#d9e0e8; --pass:#15803d; --fail:#b42318; }
  * { box-sizing:border-box; }
  body { margin:0; padding:2.5rem 1.5rem 4rem; color:var(--ink);
         font:400 16px/1.6 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width:780px; margin:0 auto; }
  h1 { font-size:1.6rem; margin:0 0 .3rem; letter-spacing:-.01em; }
  .lede { color:var(--muted); margin:0 0 2rem; }
  .score { font-size:1.1rem; font-weight:700; padding:.9rem 1.2rem; border-radius:10px;
           margin-bottom:2rem; border:1px solid var(--line); }
  .score.good { color:var(--pass); border-color:#bbf7d0; background:#f0fdf4; }
  .score.bad  { color:var(--fail); border-color:#fecdca; background:#fef3f2; }
  h2 { font-size:1rem; margin:1.75rem 0 .6rem; padding-bottom:.4rem; border-bottom:1px solid var(--line); }
  ul { list-style:none; margin:0; padding:0; }
  li { display:flex; gap:.7rem; padding:.3rem 0; align-items:baseline; }
  .tag { font-size:.7rem; font-weight:700; letter-spacing:.04em; padding:.1rem .45rem;
         border-radius:4px; flex:none; }
  .tag.p { color:var(--pass); background:#f0fdf4; }
  .tag.f { color:var(--fail); background:#fef3f2; }
  .msg { display:block; color:var(--fail); font-size:.85rem;
         font-family:ui-monospace,Menlo,Consolas,monospace; margin-top:.2rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Engine tests</h1>
  <p class="lede">Checks the tournament rules against the engine. Everything must pass before results go live.</p>
  <div id="score" class="score">Running…</div>
  <div id="out"></div>
</div>

<script type="module">
import { summary } from "./engine.test.js";

const s = summary();
const score = document.getElementById("score");
score.className = "score " + (s.fail ? "bad" : "good");
score.textContent = s.fail
  ? `${s.fail} of ${s.total} tests failed`
  : `All ${s.total} tests passed`;

const out = document.getElementById("out");
let group = null, list = null;

for (const r of s.results) {
  if (r.group !== group) {
    group = r.group;
    const h = document.createElement("h2");
    h.textContent = group;
    out.append(h);
    list = document.createElement("ul");
    out.append(list);
  }
  const li = document.createElement("li");
  li.innerHTML =
    `<span class="tag ${r.pass ? "p" : "f"}">${r.pass ? "PASS" : "FAIL"}</span>` +
    `<span>${r.name}${r.pass ? "" : `<span class="msg">${r.msg}</span>`}</span>`;
  list.append(li);
}
</script>
</body>
</html>
