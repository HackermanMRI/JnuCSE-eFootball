<!-- Page-to-page transitions. Inline, not in animations.css: Chromium decides
     whether the arriving page opts in before external stylesheets apply. -->
<style>@media (prefers-reduced-motion: no-preference) { @view-transition { navigation: auto; } }</style>
<link rel="icon" href="assets/_small/favicon.png" type="image/png">
<script>
  /* Runs before the first paint. See docs/07-LIQUID-GLASS.md. */
  (function () {
    var d = document.documentElement;
    var ORDER = ["index", "premium", "second-tier", "history", "players"];
    function place(url) {
      try {
        var m = new URL(url, location.href).pathname.match(/([\w-]+)\.html$/);
        return m ? ORDER.indexOf(m[1]) : 0;          /* "/" is the News page */
      } catch (e) { return -1; }
    }
    /* Arriving through a page transition: note which way we travelled along
       the tab bar, so the pages slide the matching way (animations.css). */
    addEventListener("pagereveal", function (e) {
      if (!e.viewTransition) return;
      d.classList.add("vt-in");
      var nav = window.navigation, from = nav && nav.activation && nav.activation.from;
      var a = place((from && from.url) || document.referrer), b = place(location.href);
      if (a >= 0 && b >= 0 && a !== b) d.classList.add(b > a ? "vt-forward" : "vt-back");
    });
    /* A page prepared in the background waits to animate until it is shown. */
    if (document.prerendering) {
      d.classList.add("is-prerendering");
      document.addEventListener("prerenderingchange", function () { d.classList.remove("is-prerendering"); }, { once: true });
    }
    /* The background worker (sw.js) says when it has found newer files than
       the ones on screen. Listen from the very start; js/ui/offline.js
       shows the notice. */
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.addEventListener("message", function (e) {
        if (!e.data || e.data.type !== "content-updated") return;
        window.__contentUpdated = true;
        dispatchEvent(new Event("jnucse:updated"));
      });
    }
    try {
      /* Keeps the drifting background continuous from page to page. */
      d.style.setProperty("--ambient-t", "-" + (Date.now() / 1000 % 600).toFixed(2) + "s");
      /* Applies the "Reduce transparency" choice without a flash. */
      var p = localStorage.getItem("jnucse:transparency");
      if (p === "reduced" || (p !== "full" && matchMedia("(prefers-reduced-transparency: reduce)").matches)) {
        d.dataset.transparency = "reduced";
      }
    } catch (e) {}
  })();
</script>
